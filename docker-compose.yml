version: '3.8'

services:
  gms-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: gms-sqlserver
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD}", "-C", "-Q", "SELECT 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - gms-network
    # Note: No ports exposed to host. The database is only accessible inside the gms-network.

  gms-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gms-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - AI__BaseUrl=http://gms-ollama:11434
      - AI__Model=llama3.2:1b
    depends_on:
      gms-sqlserver:
        condition: service_healthy
    volumes:
      - api-uploads:/app/uploads
      - api-logs:/app/logs
    networks:
      - gms-network

  gms-frontend:
    build:
      context: ./ClientApp
      dockerfile: Dockerfile
    container_name: gms-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - gms-api
    networks:
      - gms-network

  gms-ollama:
    image: ollama/ollama:latest
    container_name: gms-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - gms-network
    # Initialization container to automatically pull the model on startup if it doesn't exist
    # Can be run manually via: docker compose run --rm ollama-init
    # Initialization container to automatically pull the model on startup if it doesn't exist
    # Can be run manually via: docker compose run --rm ollama-init

  ollama-init:
    image: curlimages/curl:latest
    container_name: ollama-init
    depends_on:
      - gms-ollama
    networks:
      - gms-network
    command: >
      sh -c "
      echo 'Waiting for Ollama to be ready...';
      until curl -s -f http://gms-ollama:11434/api/version; do sleep 5; done;
      echo 'Ollama is up. Pulling Llama3.2:1b...';
      until curl -s -f -X POST http://gms-ollama:11434/api/pull -d '{\"name\":\"llama3.2:1b\"}'; do
        echo 'Pull failed, retrying in 10 seconds...';
        sleep 10;
      done;
      echo 'Done! AI is ready.';
      "
volumes:
  sql-data:
  api-uploads:
  api-logs:
  ollama-data:

networks:
  gms-network:
    driver: bridge
