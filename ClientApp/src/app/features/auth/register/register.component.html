<div class="auth-wrapper">
  <!-- Split Screen Background Illustration -->
  <div class="auth-illustration">
    <div class="illustration-content">
      <h1>Join GMS</h1>
      <p>Transforming Grievance Management.</p>
      <div class="graphic-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
      </div>
    </div>
  </div>

  <!-- Register Form Container -->
  <div class="auth-form-container">
    <div class="glass-panel auth-card">
      <div class="auth-header">
        <h2>Create an Account</h2>
        <p>Enter your details to get started.</p>
      </div>

      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="flex-col gap-2">
        
        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Full Name</mat-label>
          <input matInput type="text" formControlName="fullName" placeholder="Aadi">
          <mat-icon matPrefix>person</mat-icon>
          <mat-error *ngIf="registerForm.get('fullName')?.hasError('required')">Full Name is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Email Address</mat-label>
          <input matInput type="email" formControlName="email" placeholder="name@example.com">
          <mat-icon matPrefix>email</mat-icon>
          <mat-error *ngIf="registerForm.get('email')?.hasError('required')">Email is required</mat-error>
          <mat-error *ngIf="registerForm.get('email')?.hasError('email')">Please enter a valid email</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="w-100">
          <mat-label>Password</mat-label>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password">
          <mat-icon matPrefix>lock</mat-icon>
          <button mat-icon-button matSuffix (click)="hidePassword = !hidePassword" type="button"
                  [attr.aria-label]="'Hide password'" [attr.aria-pressed]="hidePassword">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="registerForm.get('password')?.hasError('required')">Password is required</mat-error>
        </mat-form-field>

        <button mat-flat-button color="primary" type="submit" class="submit-btn" [disabled]="registerForm.invalid || loading">
          <mat-spinner diameter="24" *ngIf="loading"></mat-spinner>
          <span *ngIf="!loading">Create Account</span>
        </button>

      </form>

      <div class="auth-footer">
        <p>Already have an account? <a routerLink="/login">Sign in</a></p>
      </div>
    </div>
  </div>
</div>
